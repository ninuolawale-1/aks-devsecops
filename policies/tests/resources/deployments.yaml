  name: bad-hostpath-caps
  namespace: secure-app
spec:
  selector: { matchLabels: { app: bad } }
  template:
    metadata: { labels: { app: bad } }
    spec:
      hostNetwork: true
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: host
          hostPath: { path: /etc }
      containers:
        - name: app
          image: __ACR_LOGIN_SERVER__/secure-api:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { add: ["NET_ADMIN"] }
